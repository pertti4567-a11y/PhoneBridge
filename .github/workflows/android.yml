name: Build Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Controller and Target APKs
        run: gradle --no-daemon assembleControllerDebug assembleTargetDebug
      - name: Upload Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Controller-APK
          path: app/build/outputs/apk/controller/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Target APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Target-APK
          path: app/build/outputs/apk/target/debug/*.apk
          if-no-files-found: error
          retention-days: 30
