plugins { id 'com.android.application' }

android {
    namespace 'com.phonebridge.android'
    compileSdk 35
    defaultConfig { applicationId 'com.phonebridge.android'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    flavorDimensions += 'role'
    productFlavors {
        controller { dimension 'role'; applicationIdSuffix '.controller'; versionNameSuffix '-controller'; buildConfigField 'String', 'ROLE', '"controller"' }
        target { dimension 'role'; applicationIdSuffix '.target'; versionNameSuffix '-target'; buildConfigField 'String', 'ROLE', '"target"' }
    }
    buildFeatures { buildConfig true }
}
dependencies { implementation 'androidx.documentfile:documentfile:1.0.1' }
